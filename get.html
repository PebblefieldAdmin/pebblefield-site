<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get Pebblefield</title>
<meta name="description" content="Pebblefield: calm, no-guessing Minesweeper that paints a hidden picture. Free on the App Store.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<!--
  The one link for ads and bios: get.html?c=<campaign> (for example get.html?c=tiktok-launch).
  iPhone and iPad go straight to the App Store, Android to Google Play once it is live (until then, the home page),
  anything else to the home page. With Apple's provider token (PT below, from App Store Connect > App Analytics >
  Acquisition > Campaigns) the App Store counts downloads per campaign; Google Play counts its UTM tags.
-->
<style>
  :root{ --bg:#DCE7E6; --ink:#23383D; --link:#1F7FA3; }
  @media (prefers-color-scheme: dark){ :root{ --bg:#0F1A20; --ink:#DCEBEA; --link:#7CCFEA; } }
  body{ margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink); font:500 17px/1.6 ui-rounded, -apple-system, system-ui, sans-serif; padding:16px; text-align:center; }
  a{ color:var(--link); }
</style>
</head>
<body>
<p>Taking you to <a id="go" href="./">Pebblefield</a>…</p>
<script>
(function(){
  var APP = 'https://apps.apple.com/app/id6817978780', PLAY = 'https://play.google.com/store/apps/details?id=com.pebbleadmin.pebblefield';
  var PT = '';            // Apple's provider token (a number), so App Store downloads are counted per campaign
  var PLAY_LIVE = false;  // true once Pebblefield is live on Google Play
  var c = (new URLSearchParams(location.search).get('c') || 'web').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 40) || 'web';
  var ua = navigator.userAgent, ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1), android = /Android/.test(ua);
  var to = './';
  if (ios) to = APP + (PT ? '?pt=' + PT + '&ct=' + c + '&mt=8' : '');
  else if (android && PLAY_LIVE) to = PLAY + '&referrer=' + encodeURIComponent('utm_source=' + c + '&utm_medium=ad&utm_campaign=' + c);
  document.getElementById('go').href = to;
  location.replace(to);
})();
</script>
</body>
</html>
